[build-system]
requires = ["setuptools>=81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kayak"
version = "0.1.4"
description = "Mojo-first late-interaction retrieval engine"
readme = "python/kayak/README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["colbert-ai>=0.2.22,<0.3", "ir-datasets>=0.5.11,<0.6", "numpy>=2.0,<3", "torch>=2.11.0,<3", "transformers<5"]

[tool.pixi.workspace]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.tasks]
demo = "mojo -I . examples/exact_search.mojo"
demo_scifact = "mojo -I . examples/scifact_real_subset.mojo"
demo_fiqa = "mojo -I . examples/fiqa_real_subset.mojo"
explain_scifact_collection = "mojo -I . examples/scifact_collection_explain.mojo"
report_scifact_collection_storage = "mojo -I . examples/scifact_collection_storage_report.mojo"
demo_python_sdk = "PYTHONPATH=python python python/examples/quickstart.py"
demo_python_sdk_mojo = "PYTHONPATH=python python python/examples/mojo_exact_cpu_quickstart.py"
demo_hosted_collection = "mojo -I . examples/hosted_collection_smoke.mojo"
bench_python_batch_maxsim_naive_raw = "PYTHONPATH=python python python/scripts/bench_batch_maxsim.py --mode naive_loop"
bench_python_batch_maxsim_shared_raw = "PYTHONPATH=python python python/scripts/bench_batch_maxsim.py --mode shared_batch"
bench_python_batch_maxsim_naive = "bash scripts/run_bench_quiet.sh -- pixi run bench_python_batch_maxsim_naive_raw"
bench_python_batch_maxsim_shared = "bash scripts/run_bench_quiet.sh -- pixi run bench_python_batch_maxsim_shared_raw"
test_index = "mojo -I . tests/test_index.mojo"
test_maxsim = "mojo -I . tests/test_maxsim.mojo"
test_eval = "mojo -I . tests/test_eval_metrics.mojo"
test_proxies = "mojo -I . tests/test_proxy_tasks.mojo"
test_python_bridge = "mojo -I . tests/test_python_bridge.mojo"
test_python_api = "PYTHONPATH=python python -m unittest discover -s python/tests -p 'test_*.py'"
test_python_sdk_ordeal = "PYTHONPATH=python uv run --python 3.11 --with ordeal ordeal explore -c ordeal.toml"
test_python_sdk_ordeal_mojo = "KAYAK_ORDEAL_ENABLE_MOJO=1 PYTHONPATH=python uv run --python 3.11 --with ordeal ordeal explore -c ordeal.toml"
test_storage = "mojo -I . tests/test_storage.mojo"
test_centroid_postings_store = "mojo -I . tests/test_centroid_postings_store.mojo"
test_centroid_heads_store = "mojo -I . tests/test_centroid_heads_store.mojo"
test_collections = "mojo -I . tests/test_collection_contracts.mojo"
test_collection_storage = "mojo -I . tests/test_collection_storage.mojo"
test_collection_resolution = "mojo -I . tests/test_collection_resolution.mojo"
test_collection_search_plan = "mojo -I . tests/test_collection_search_plan.mojo"
test_collection_report_json = "mojo -I . tests/test_collection_report_json.mojo"
test_service_contracts = "mojo -I . tests/test_service_contracts.mojo"
test_service_runtime = "mojo -I . tests/test_service_runtime.mojo"
test_filters = "mojo -I . tests/test_filters.mojo"
test_filter_fixtures = "mojo -I . tests/test_filter_fixtures.mojo"
test_snapshot_bundle = "mojo -I . tests/test_snapshot_bundle.mojo"
test_service_json = "mojo -I . tests/test_service_json.mojo"
test_stage_aware_benchmark_json = "mojo -I . tests/test_stage_aware_benchmark_json.mojo"
test_candidate_window_json = "mojo -I . tests/test_candidate_window_json.mojo"
test_vector_budget_json = "mojo -I . tests/test_vector_budget_json.mojo"
test_score_histogram = "mojo -I . tests/test_score_histogram.mojo"
test_runtime_backend = "mojo -I . tests/test_runtime_backend.mojo"
test_real_slice_collection_storage_json = "mojo -I . tests/test_real_slice_collection_storage_json.mojo"
test_real_slice_benchmark_json = "mojo -I . tests/test_real_slice_benchmark_json.mojo"
test_public_benchmark_json = "mojo -I . tests/test_public_benchmark_json.mojo"
test_storage_compat = "mojo -I . tests/test_storage_compat.mojo"
test_storage_invariants = "mojo -I . tests/test_storage_invariants.mojo"
test_score_partitions = "mojo -I . tests/test_score_partitions.mojo"
test_hybrid_flat_dim128 = "mojo -I . tests/test_hybrid_flat_dim128.mojo"
test_verifier = "mojo -I . tests/test_verifier.mojo"
test_battle = "mojo -I . tests/test_battle.mojo"
test_eval_battle = "mojo -I . tests/test_eval_battle.mojo"
bench_exact_raw = "mojo -I . benchmarks/exact_cpu_search.mojo"
bench_profile_exact_raw = "mojo -I . benchmarks/profile_exact_cpu_matrix.mojo"
bench_profile_cpu_micro_raw = "mojo -I . benchmarks/profile_exact_cpu_micro.mojo"
bench_profile_cpu_structural_raw = "mojo -I . benchmarks/profile_exact_cpu_structural.mojo"
bench_profile_cpu_structural_real_subset_raw = "mojo -I . benchmarks/profile_exact_cpu_structural_real_subset.mojo"
bench_profile_cpu_hybrid_real_subset_raw = "mojo -I . benchmarks/profile_exact_cpu_hybrid_real_subset.mojo"
bench_profile_cpu_verifier_real_subset_raw = "mojo -I . benchmarks/profile_exact_cpu_verifier_real_subset.mojo"
bench_profile_storage_real_subset_raw = "mojo -I . benchmarks/profile_storage_real_subset.mojo"
bench_profile_cpu_configs_raw = "mojo -I . benchmarks/profile_exact_cpu_configs.mojo"
bench_profile_cpu_usl_raw = "mojo -I . benchmarks/profile_exact_cpu_usl.mojo"
bench_profile_cpu_partitions_raw = "mojo -I . benchmarks/profile_exact_cpu_partition_sweep.mojo"
bench_matrix_raw = "mojo -I . benchmarks/workload_matrix.mojo"
bench_exact = "bash scripts/run_bench_quiet.sh -- pixi run bench_exact_raw"
bench_profile_exact = "bash scripts/run_bench_quiet.sh -- pixi run bench_profile_exact_raw"
bench_profile_cpu_micro = "bash scripts/run_bench_quiet.sh -- pixi run bench_profile_cpu_micro_raw"
bench_profile_cpu_structural = "bash scripts/run_bench_quiet.sh -- pixi run bench_profile_cpu_structural_raw"
bench_profile_cpu_structural_real_subset = "bash scripts/run_bench_quiet.sh -- pixi run bench_profile_cpu_structural_real_subset_raw"
bench_profile_cpu_hybrid_real_subset = "bash scripts/run_bench_quiet.sh -- pixi run bench_profile_cpu_hybrid_real_subset_raw"
bench_profile_cpu_verifier_real_subset = "bash scripts/run_bench_quiet.sh -- pixi run bench_profile_cpu_verifier_real_subset_raw"
bench_profile_storage_real_subset = "bash scripts/run_bench_quiet.sh -- pixi run bench_profile_storage_real_subset_raw"
bench_profile_cpu_configs = "bash scripts/run_bench_quiet.sh -- pixi run bench_profile_cpu_configs_raw"
bench_profile_cpu_usl = "bash scripts/run_bench_quiet.sh -- pixi run bench_profile_cpu_usl_raw"
bench_profile_cpu_partitions = "bash scripts/run_bench_quiet.sh -- pixi run bench_profile_cpu_partitions_raw"
bench_matrix = "bash scripts/run_bench_quiet.sh -- pixi run bench_matrix_raw"
eval_matrix = "mojo -I . benchmarks/eval_matrix.mojo"
bench_scifact_raw = "mojo -I . benchmarks/scifact_real_subset_search.mojo"
bench_fiqa_raw = "mojo -I . benchmarks/fiqa_real_subset_search.mojo"
bench_limit_small_raw = "mojo -I . benchmarks/limit_small_real_subset_search.mojo"
bench_browsecomp_plus_raw = "python python/scripts/build_browsecomp_plus_task_json.py && mojo -I . benchmarks/browsecomp_plus_real_subset_search.mojo"
bench_browsecomp_plus_gold_raw = "python python/scripts/build_browsecomp_plus_task_json.py && mojo -I . benchmarks/browsecomp_plus_gold_real_subset_search.mojo"
bench_browsecomp_plus_diag = "python python/scripts/build_browsecomp_plus_task_json.py && mojo -I . benchmarks/browsecomp_plus_query_diagnostics.mojo"
bench_browsecomp_plus_ranks = "python python/scripts/build_browsecomp_plus_task_json.py && mojo -I . benchmarks/browsecomp_plus_rank_coverage.mojo"
bench_browsecomp_plus_clause = "python python/scripts/build_browsecomp_plus_task_json.py && mojo -I . benchmarks/browsecomp_plus_clause_text_verifier.mojo"
bench_real_subset_json = "python python/scripts/build_browsecomp_plus_task_json.py && mojo -I . benchmarks/real_subset_search_json.mojo"
bench_real_subset_collection_storage_json = "python python/scripts/build_browsecomp_plus_task_json.py && mojo -I . benchmarks/real_subset_collection_storage_json.mojo"
bench_real_subset_candidate_windows = "python python/scripts/build_browsecomp_plus_task_json.py && mojo -I . benchmarks/real_subset_candidate_window_sweep.mojo"
bench_real_subset_vector_budgets = "python python/scripts/build_browsecomp_plus_task_json.py && mojo -I . benchmarks/real_subset_vector_budget_sweep.mojo"
bench_real_subset_policies_raw = "mojo -I . benchmarks/real_subset_partition_policies.mojo"
bench_real_subset_breakdown_raw = "mojo -I . benchmarks/real_subset_search_breakdown.mojo"
bench_hard_recall_real_subset_raw = "python python/scripts/build_browsecomp_plus_task_json.py && mojo -I . benchmarks/hard_recall_real_subset.mojo"
bench_scifact = "bash scripts/run_bench_quiet.sh -- pixi run bench_scifact_raw"
bench_fiqa = "bash scripts/run_bench_quiet.sh -- pixi run bench_fiqa_raw"
bench_limit_small = "bash scripts/run_bench_quiet.sh -- pixi run bench_limit_small_raw"
bench_browsecomp_plus = "bash scripts/run_bench_quiet.sh -- pixi run bench_browsecomp_plus_raw"
bench_browsecomp_plus_gold = "bash scripts/run_bench_quiet.sh -- pixi run bench_browsecomp_plus_gold_raw"
bench_real_subset_policies = "bash scripts/run_bench_quiet.sh -- pixi run bench_real_subset_policies_raw"
bench_real_subset_breakdown = "bash scripts/run_bench_quiet.sh -- pixi run bench_real_subset_breakdown_raw"
bench_hard_recall_real_subset = "bash scripts/run_bench_quiet.sh -- pixi run bench_hard_recall_real_subset_raw"
profile_scifact_hot_loop = "mojo -I . benchmarks/profile_scifact_hot_loop.mojo"
fit_usl = "python python/scripts/fit_usl.py"
summarize_partitions = "python python/scripts/summarize_partition_sweep.py"
mutate_smoke = "python python/scripts/mutation_smoke.py"
build_browsecomp_plus_task_json = "python python/scripts/build_browsecomp_plus_task_json.py"
package_mojo = "mojo package kayak -o dist/kayak.mojopkg"

[tool.pixi.dependencies]
mojo = ">=0.26.3.0.dev2026041020,<0.27"
python = "3.11.*"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "python"

[tool.setuptools.packages.find]
where = ["python"]
include = ["kayak", "kayak_bridge"]

[tool.setuptools.package-data]
kayak_bridge = ["*.mojo", "_artifacts/*.mojopkg"]
