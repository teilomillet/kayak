[build-system]
requires = ["setuptools>=81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kayak"
version = "0.3.0"
description = "Mojo-first late-interaction retrieval engine"
readme = "python/kayak/README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["colbert-ai>=0.2.22,<0.3", "ir-datasets>=0.5.11,<0.6", "numpy>=2.0,<3", "torch>=2.11.0,<3", "transformers<5"]

[tool.pixi.workspace]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.tasks]
demo = "mojo -I . examples/exact_search.mojo"
demo_scifact = "mojo -I . examples/scifact_real_subset.mojo"
demo_fiqa = "mojo -I . examples/fiqa_real_subset.mojo"
explain_scifact_collection = "mojo -I . examples/scifact_collection_explain.mojo"
report_scifact_collection_storage = "mojo -I . examples/scifact_collection_storage_report.mojo"
demo_python_sdk = "PYTHONPATH=python python python/examples/quickstart.py"
demo_python_sdk_mojo = "PYTHONPATH=python python python/examples/mojo_exact_cpu_quickstart.py"
demo_hosted_collection = "mojo -I . examples/hosted_collection_smoke.mojo"
bench_python_batch_maxsim_naive_raw = "PYTHONPATH=python python python/scripts/bench_batch_maxsim.py --mode naive_loop"
bench_python_batch_maxsim_shared_raw = "PYTHONPATH=python python python/scripts/bench_batch_maxsim.py --mode shared_batch"
bench_python_batch_maxsim_naive = "bash scripts/run_bench_quiet.sh -- pixi run bench_python_batch_maxsim_naive_raw"
bench_python_batch_maxsim_shared = "bash scripts/run_bench_quiet.sh -- pixi run bench_python_batch_maxsim_shared_raw"
bench_fastplaid_speed_track_kayak_smoke_raw = "PYTHONPATH=python python python/scripts/bench_fastplaid_speed_track.py --engines kayak_exact,kayak_plaid --document-count 64 --document-vector-count 16 --query-count 4 --query-vector-count 8 --vector-dim 128 --top-k 10 --warmup-iterations 1 --measurement-iterations 2 --kayak-plaid-candidate-k 40 --kayak-plaid-centroids-per-query-vector 16 --output .cache/kayak/fastplaid_speed_track_kayak_smoke/summary.json --index-root .cache/kayak/fastplaid_speed_track_kayak_smoke/indexes --overwrite-index-root"
bench_fastplaid_speed_track_raw = "UV_CACHE_DIR=.cache/uv PYTHONPATH=python uv run --python 3.11 --with fast-plaid==1.4.6.2110 python python/scripts/bench_fastplaid_speed_track.py --engines kayak_exact,kayak_plaid,fastplaid --document-count 256 --document-vector-count 32 --query-count 8 --query-vector-count 16 --vector-dim 128 --top-k 10 --warmup-iterations 1 --measurement-iterations 3 --kayak-plaid-candidate-k 160 --kayak-plaid-centroids-per-query-vector 32 --index-root .cache/kayak/fastplaid_speed_track_scorecard/indexes --overwrite-index-root --output .cache/kayak/fastplaid_speed_track_scorecard/summary.json --require-fastplaid"
