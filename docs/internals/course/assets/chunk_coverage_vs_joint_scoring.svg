<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
  <title id="title">Chunk Coverage Versus Joint Scoring</title>
  <desc id="desc">A four-panel diagram explaining that chunking covers the whole document, but retrieval usually still scores chunks rather than the whole document jointly.</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .panel { fill: #fffdf8; stroke: #1e2a24; stroke-width: 2; rx: 20; ry: 20; }
    .panel-title { font: 700 26px Georgia, 'Times New Roman', serif; fill: #1e2a24; }
    .body { font: 500 19px Georgia, 'Times New Roman', serif; fill: #24312b; }
    .small { font: 500 16px Georgia, 'Times New Roman', serif; fill: #34423c; }
    .doc { fill: #dbead6; stroke: #29523d; stroke-width: 2; }
    .chunk-a { fill: #f6d98b; stroke: #8a6b10; stroke-width: 2; }
    .chunk-b { fill: #d7e3f7; stroke: #40608d; stroke-width: 2; }
    .chunk-c { fill: #f8d4d0; stroke: #8e4d48; stroke-width: 2; }
    .chunk-d { fill: #d9efe9; stroke: #3f7465; stroke-width: 2; }
    .callout { fill: #fff3cd; stroke: #8a6b10; stroke-width: 2; rx: 14; ry: 14; }
    .accent { font: 700 20px Georgia, 'Times New Roman', serif; fill: #6c4d00; }
    .footer { fill: #e8f0eb; stroke: #1e2a24; stroke-width: 2; rx: 18; ry: 18; }
    .arrow { stroke: #1e2a24; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    .soft-arrow { stroke: #56645e; stroke-width: 2.5; fill: none; marker-end: url(#arrowheadSoft); }
    .divider { stroke: #d5d1c5; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#1e2a24"/>
    </marker>
    <marker id="arrowheadSoft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#56645e"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="940"/>

  <text x="640" y="58" text-anchor="middle" class="panel-title" style="font-size:38px;">Chunk Coverage Versus Joint Scoring</text>
  <text x="640" y="92" text-anchor="middle" class="body">Chunking usually covers the whole document. That does not automatically mean the system scores the whole document jointly.</text>

  <rect class="panel" x="38" y="128" width="580" height="330"/>
  <rect class="panel" x="662" y="128" width="580" height="330"/>
  <rect class="panel" x="38" y="486" width="580" height="330"/>
  <rect class="panel" x="662" y="486" width="580" height="330"/>

  <text x="68" y="170" class="panel-title">1. Coverage: the whole document is indexed</text>
  <rect class="doc" x="88" y="214" width="470" height="56" rx="12" ry="12"/>
  <text x="323" y="249" text-anchor="middle" class="body">Document A: full text is present</text>
  <line class="arrow" x1="323" y1="272" x2="323" y2="318"/>
  <rect class="chunk-a" x="92" y="336" width="104" height="52" rx="10" ry="10"/>
  <rect class="chunk-a" x="210" y="336" width="104" height="52" rx="10" ry="10"/>
  <rect class="chunk-a" x="328" y="336" width="104" height="52" rx="10" ry="10"/>
  <rect class="chunk-a" x="446" y="336" width="104" height="52" rx="10" ry="10"/>
  <text x="144" y="368" text-anchor="middle" class="body">chunk 1</text>
  <text x="262" y="368" text-anchor="middle" class="body">chunk 2</text>
  <text x="380" y="368" text-anchor="middle" class="body">chunk 3</text>
  <text x="498" y="368" text-anchor="middle" class="body">chunk 4</text>
  <text x="88" y="424" class="small">What this gives you:</text>
  <text x="88" y="448" class="small">The document is fully covered by retrieval units.</text>
  <text x="88" y="474" class="small">What it does not yet give you: one joint score for the whole document.</text>

  <text x="692" y="170" class="panel-title">2. Retrieval: chunks compete against chunks</text>
  <circle cx="760" cy="252" r="48" fill="#eef4f0" stroke="#1e2a24" stroke-width="2"/>
  <text x="760" y="246" text-anchor="middle" class="body">user</text>
  <text x="760" y="270" text-anchor="middle" class="body">query</text>
  <line class="arrow" x1="812" y1="252" x2="898" y2="252"/>
  <rect class="chunk-a" x="918" y="198" width="248" height="40" rx="10" ry="10"/>
  <rect class="chunk-b" x="918" y="244" width="248" height="40" rx="10" ry="10"/>
  <rect class="chunk-a" x="918" y="290" width="248" height="40" rx="10" ry="10"/>
  <rect class="chunk-c" x="918" y="336" width="248" height="40" rx="10" ry="10"/>
  <rect class="chunk-d" x="918" y="382" width="248" height="40" rx="10" ry="10"/>
  <text x="1042" y="223" text-anchor="middle" class="body">doc A / chunk 2</text>
  <text x="1042" y="269" text-anchor="middle" class="body">doc B / chunk 5</text>
  <text x="1042" y="315" text-anchor="middle" class="body">doc A / chunk 3</text>
  <text x="1042" y="361" text-anchor="middle" class="body">doc C / chunk 1</text>
  <text x="1042" y="407" text-anchor="middle" class="body">doc D / chunk 7</text>
  <text x="692" y="448" class="small">Typical first-stage competition is global chunk ranking, not whole-document scoring.</text>

  <text x="68" y="528" class="panel-title">3. Loss mode: the globally right document can still lose</text>
  <text x="96" y="572" class="body">Document A</text>
  <rect class="chunk-a" x="96" y="594" width="170" height="38" rx="10" ry="10"/>
  <rect class="chunk-a" x="96" y="640" width="170" height="38" rx="10" ry="10"/>
  <rect class="chunk-a" x="96" y="686" width="170" height="38" rx="10" ry="10"/>
  <text x="181" y="618" text-anchor="middle" class="body">moderate local match</text>
  <text x="181" y="664" text-anchor="middle" class="body">moderate local match</text>
  <text x="181" y="710" text-anchor="middle" class="body">moderate local match</text>

  <text x="344" y="572" class="body">Document B</text>
  <rect class="chunk-b" x="344" y="640" width="170" height="38" rx="10" ry="10"/>
  <text x="429" y="664" text-anchor="middle" class="body">one sharp local match</text>
  <line class="soft-arrow" x1="514" y1="659" x2="560" y2="659"/>
  <rect class="callout" x="560" y="628" width="180" height="62"/>
  <text x="650" y="653" text-anchor="middle" class="accent">top-k keeps B / chunk 4</text>
  <text x="650" y="675" text-anchor="middle" class="small">and may drop all of A</text>
  <text x="96" y="764" class="small">Coverage is still real. The failure is that no single chunk from A looked strong enough on its own.</text>

  <text x="692" y="528" class="panel-title">4. Joint scoring is an extra design choice</text>
  <rect class="doc" x="718" y="578" width="196" height="58" rx="12" ry="12"/>
  <text x="816" y="613" text-anchor="middle" class="body">retrieve chunks</text>
  <line class="soft-arrow" x1="914" y1="607" x2="972" y2="607"/>
  <rect class="chunk-d" x="972" y="552" width="214" height="52" rx="10" ry="10"/>
  <text x="1079" y="584" text-anchor="middle" class="body">group by parent document</text>
  <rect class="chunk-d" x="972" y="618" width="214" height="52" rx="10" ry="10"/>
  <text x="1079" y="650" text-anchor="middle" class="body">aggregate or rerank parent</text>
  <rect class="chunk-d" x="972" y="684" width="214" height="52" rx="10" ry="10"/>
  <text x="1079" y="716" text-anchor="middle" class="body">or score whole document jointly</text>
  <rect class="callout" x="718" y="720" width="420" height="66"/>
  <text x="928" y="748" text-anchor="middle" class="accent">Chunk coverage != joint document score</text>
  <text x="928" y="772" text-anchor="middle" class="small">Joint scoring appears only if the system explicitly adds it.</text>

  <rect class="footer" x="80" y="842" width="1120" height="64"/>
  <text x="120" y="872" class="body">Coverage unit</text>
  <text x="268" y="872" class="small">whole document is chunked and indexed</text>
  <line class="divider" x1="410" y1="854" x2="410" y2="892"/>
  <text x="438" y="872" class="body">Retrieval unit</text>
  <text x="572" y="872" class="small">usually chunk</text>
  <line class="divider" x1="668" y1="854" x2="668" y2="892"/>
  <text x="696" y="872" class="body">Scoring unit</text>
  <text x="824" y="872" class="small">often chunk unless parent aggregation is added</text>
  <line class="divider" x1="1030" y1="854" x2="1030" y2="892"/>
  <text x="1058" y="872" class="body">Context unit</text>
  <text x="1170" y="872" class="small">top chunks</text>
</svg>
